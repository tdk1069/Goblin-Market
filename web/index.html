<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LuvlyAH Ledger</title>
  <meta name="description" content="Search auction house sales, items, buyers and sellers.">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23e0bd72'/%3E%3Ccircle cx='16' cy='16' r='9.5' fill='none' stroke='%231c1503' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="top">
    <div class="wrap top-in">
      <a class="brand" href="#/">
        <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" class="coin"/><circle cx="16" cy="16" r="9.5" class="coin-ring"/></svg>
        <span>LuvlyAH Ledger</span>
      </a>
      <nav aria-label="Main">
        <a href="#/" data-nav="overview">Overview</a>
        <a href="#/sales" data-nav="sales">Sales</a>
        <a href="#/items" data-nav="items">Items</a>
        <a href="#/players" data-nav="players">Characters</a>
      </nav>
      <div class="top-tools">
        <span id="fresh" class="fresh"></span>
        <button id="theme" type="button" class="btn-quiet">Theme: auto</button>
      </div>
    </div>
  </header>

  <main id="main" class="wrap" tabindex="-1"><p class="muted">Loading market data…</p></main>

  <footer class="foot"><div class="wrap">
    <details>
      <summary>About this data</summary>
      <div id="about"></div>
    </details>
    <p class="muted small">An unofficial fan tool. It is not affiliated with the game's publisher or the server.</p>
  </div></footer>

  <div id="tip" role="tooltip" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
