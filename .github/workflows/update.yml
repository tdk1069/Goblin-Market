name: Update market data

on:
  workflow_dispatch:        # lets you press "Run workflow" by hand

permissions:
  contents: read

# Never run two collections at once.
concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write       # saves the collected data to a "data" branch
    steps:
      - uses: actions/checkout@v4

      - name: Restore saved data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p state
          if git ls-remote --exit-code --heads "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch data "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" state
            rm -rf state/.git
            echo "Restored $(ls state | wc -l) saved files"
          else
            echo "No saved data yet, this is the first run"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Copy the website
        run: |
          mkdir -p _site
          cp -r web/. _site/
          rm -rf _site/data

      - name: Collect market data
        env:
          SEARCH_HOST: ${{ vars.SEARCH_HOST }}
          SEARCH_PORT: ${{ vars.SEARCH_PORT }}
          TIME_BUDGET_MIN: ${{ vars.TIME_BUDGET_MIN }}
          REQUEST_DELAY_MS: ${{ vars.REQUEST_DELAY_MS }}
          RETAIN_DAYS: ${{ vars.RETAIN_DAYS }}
        run: node scraper/scrape.mjs

      - name: Save data for next time
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd state
          git init -q -b data
          git config user.name "market-bot"
          git config user.email "market-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Deploy runs as its own job: GitHub's artifact list can lag a moment behind
  # the upload, and deploying straight after uploading in the same job often
  # found no artifact. A second attempt after a short wait covers any leftover lag.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 30
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
